name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (macOS, real CryptoKit)
        run: swift test
  watch-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build watchOS app for the simulator
        run: |
          xcodebuild build \
            -project TeslaWatch.xcodeproj \
            -scheme TeslaWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
