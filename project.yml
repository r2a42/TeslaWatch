# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: TeslaWatch
options:
  bundleIdPrefix: com.r2a42   # change to your own reverse-DNS prefix
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
packages:
  TeslaKit:
    path: .
targets:
  TeslaWatch:
    type: application
    platform: watchOS
    sources:
      - App/TeslaWatch
    dependencies:
      - package: TeslaKit
    info:
      path: App/TeslaWatch/Info.plist
      properties:
        CFBundleDisplayName: WatchKeyT
        WKApplication: true
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false   # standard algorithms via Apple's CryptoKit only
        WKWatchOnly: true   # no companion code; the iOS host app only carries it
        NSBluetoothAlwaysUsageDescription: WatchKeyT uses Bluetooth to connect to your vehicle so you can lock, unlock and open it from your watch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r2a42.teslakey.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D3B47Q3BHN
  TeslaHost:
    type: application
    platform: iOS
    sources:
      - App/TeslaHost
    dependencies:
      - target: TeslaWatch
    info:
      path: App/TeslaHost/Info.plist
      properties:
        CFBundleDisplayName: WatchKeyT
        UILaunchScreen: {}
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationLaunchProhibited: true   # watch-only container
        ITSWatchOnlyContainer: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r2a42.teslakey
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D3B47Q3BHN
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.0"
  TeslaPhone:
    type: application
    platform: iOS
    sources:
      - path: App/TeslaWatch
        excludes:
          - TeslaWatchApp.swift
          - Info.plist
          - Assets.xcassets
      - App/TeslaPhone
    dependencies:
      - package: TeslaKit
    info:
      path: App/TeslaPhone/Info.plist
      properties:
        CFBundleDisplayName: Key Test Phone
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Uses Bluetooth to connect to your vehicle so you can test lock and unlock.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r2a42.teslakey.phonetest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D3B47Q3BHN
        TARGETED_DEVICE_FAMILY: "1"
